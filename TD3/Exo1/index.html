<!DOCTYPE html>
<html lang="en">
<head>
	<title>Géoloc with BabylonJS</title>
	<meta charset="utf-8"/>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; }
        #renderCanvas { width: 100vw; height: 100vh; display: block; }

        #geoOverlay{
        position:fixed; inset:0;
        background:rgba(0,0,0,0.5);
        display:flex; align-items:center; justify-content:center;
        z-index:1000; cursor:pointer; user-select:none;
        }
        .hidden{ display:none; }
        #geoOverlay .msg{
        padding:16px 22px; border-radius:10px;
        background:rgba(0,0,0,0.6); color:#fff; font-family:system-ui, sans-serif;
        font-size:18px;
        }
        .hidden{ display:none; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <div id="geoOverlay"><div class="msg">Cliquer pour lancer la geoloc</div></div>
    <canvas id="renderCanvas"></canvas>
    <script>
        function toRad(deg) { return deg * Math.PI / 180; }
        function toDeg(rad) { return rad * 180 / Math.PI; }

        function latLongToXYZ(latDeg, lonDeg, radius) {
            // normalisation optionnelle
            let lat = ((latDeg + 90) % 180) - 90;
            let lon = ((lonDeg + 180) % 360) - 180;

            const phi = toRad(lat);
            const lam = toRad(lon);

            const x = -radius * Math.cos(phi) * Math.sin(lam);
            const y = radius * Math.sin(phi);
            const z = radius * Math.cos(phi) * Math.cos(lam);

            return new BABYLON.Vector3(x, y, z);
        }

        function xyzToLatLong(pos) {
            const r = pos.length();
            const phi = Math.asin(pos.y / r);
            const lam = Math.atan2(pos.x, pos.z);

            return { lat: toDeg(phi), lon: toDeg(lam) };
        }

        ///////BABYLON////////
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        let camera, myMarker;

        const createScene = () => {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);

            //Camera
            camera = new BABYLON.ArcRotateCamera("camera", 0, 0, 6, new BABYLON.Vector3(0, 0, 0), scene);

            camera.lowerRadiusLimit = 2.1;
            camera.upperRadiusLimit = 10;
            camera.wheelDeltaPercentage = 0.01;

            camera.attachControl(canvas, true);

            //Lumière
            const ambientLight = new BABYLON.HemisphericLight("ambientLight", new BABYLON.Vector3(0, 0, 0), scene);
            ambientLight.intensity = 0.8;

            const light = new BABYLON.DirectionalLight("light", new BABYLON.Vector3(-1, -1.5, -1), scene);
            light.position = new BABYLON.Vector3(5, 7.5, 5);
            light.intensity = 0.3;

            const shadowGenerator = new BABYLON.ShadowGenerator(1024, light);
            shadowGenerator.useBlurExponentialShadowMap = true;

            //Terre
            const earth = BABYLON.MeshBuilder.CreateSphere("earth", { diameter: 2, segments: 32 }, scene);

            const earthMaterial = new BABYLON.StandardMaterial("earthMat");
            earthMaterial.diffuseTexture = new BABYLON.Texture("earth.jpg", scene);
            earthMaterial.diffuseTexture.uOffset = -0.25;
            earthMaterial.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            earth.material = earthMaterial;

            //Markers
            myMarker = BABYLON.MeshBuilder.CreateSphere("myMarker", { diameter: 0.01, segments: 16 }, scene);
            
            return scene;
        }
        const scene = createScene();

        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener("resize", () => engine.resize());

        const geoOverlay = document.getElementById("geoOverlay");
        geoOverlay.addEventListener("click", function onOverlayClick(){
            if (geoOverlay && geoOverlay.parentNode) {
                geoOverlay.parentNode.removeChild(geoOverlay);
            }

            navigator.geolocation.getCurrentPosition(
                function(pos){
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const v = latLongToXYZ(lat, lon, 1);
                    myMarker.position = v;
                    camera.position = latLongToXYZ(lat, lon, 3);
            });}, { once: true });
    </script>
</body>
</html>
